<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="42%" stop-color="#070707"/>
      <stop offset="70%" stop-color="#14110a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d06f"/>
      <stop offset="58%" stop-color="#c89b2c"/>
      <stop offset="100%" stop-color="#7a5612"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
    </linearGradient>
    <linearGradient id="blackPiece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#323232"/>
      <stop offset="60%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <radialGradient id="spot" cx="72%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#c89b2c" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#c89b2c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="board" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b0b0b"/>
      <rect width="60" height="60" fill="#1f1f1f"/>
      <rect x="60" y="60" width="60" height="60" fill="#1f1f1f"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#spot)"/>

  <!-- Chess board surface on the right. Kept low so it never covers the text area. -->
  <g opacity="0.72" transform="translate(655 340) skewX(-18)">
    <rect width="980" height="180" fill="url(#board)" opacity="0.72"/>
    <rect width="980" height="180" fill="none" stroke="#c89b2c" stroke-opacity="0.18"/>
  </g>
  <rect x="0" y="0" width="730" height="520" fill="url(#bg)" opacity="0.42"/>

  <!-- Back row silhouettes -->
  <g filter="url(#softShadow)" opacity="0.55">
    <g transform="translate(720 222) scale(.78)">
      <circle cx="50" cy="35" r="30" fill="url(#blackPiece)"/>
      <rect x="28" y="62" width="44" height="92" rx="17" fill="url(#blackPiece)"/>
      <rect x="5" y="145" width="90" height="26" rx="8" fill="url(#blackPiece)"/>
    </g>
    <g transform="translate(1325 218) scale(.74)">
      <circle cx="50" cy="35" r="30" fill="url(#ivory)" opacity=".78"/>
      <rect x="28" y="62" width="44" height="92" rx="17" fill="url(#ivory)" opacity=".78"/>
      <rect x="5" y="145" width="90" height="26" rx="8" fill="url(#ivory)" opacity=".78"/>
    </g>
  </g>

  <!-- Main pieces: balanced, realistic scale; no oversized knight. -->
  <g filter="url(#softShadow)">
    <!-- Black rook -->
    <g transform="translate(860 138) scale(1.08)">
      <rect x="18" y="8" width="92" height="32" fill="url(#blackPiece)"/>
      <rect x="26" y="0" width="14" height="30" fill="url(#blackPiece)"/>
      <rect x="58" y="0" width="14" height="30" fill="url(#blackPiece)"/>
      <rect x="90" y="0" width="14" height="30" fill="url(#blackPiece)"/>
      <path d="M35 40h58l12 160H23z" fill="url(#blackPiece)"/>
      <rect x="18" y="194" width="92" height="30" rx="8" fill="url(#blackPiece)"/>
      <rect x="0" y="220" width="128" height="34" rx="10" fill="url(#blackPiece)"/>
    </g>

    <!-- Gold king -->
    <g transform="translate(1020 80) scale(1.18)">
      <rect x="62" y="0" width="14" height="52" rx="2" fill="url(#gold)"/>
      <rect x="42" y="19" width="54" height="14" rx="2" fill="url(#gold)"/>
      <circle cx="69" cy="78" r="38" fill="url(#gold)"/>
      <path d="M45 105h48l18 155H27z" fill="url(#gold)"/>
      <rect x="20" y="250" width="98" height="33" rx="10" fill="url(#gold)"/>
      <rect x="0" y="279" width="140" height="38" rx="12" fill="url(#gold)"/>
    </g>

    <!-- Ivory knight, smaller and to the right -->
    <g transform="translate(1194 152) scale(.95)">
      <path d="M98 26c-16 6-29 16-39 30-10 14-17 34-14 54 4 26 26 40 44 53 16 11 26 24 25 43H39c-5-36-21-60-35-78 28-9 47-31 55-66 5-23 17-39 39-51 20-11 42-12 62-6 10 3 18 8 25 14-28 0-53 3-87 7z" fill="url(#ivory)"/>
      <circle cx="114" cy="70" r="5" fill="#111"/>
      <path d="M86 24l21-22 12 33z" fill="url(#ivory)"/>
      <rect x="28" y="205" width="112" height="31" rx="9" fill="url(#ivory)"/>
      <rect x="8" y="232" width="154" height="38" rx="12" fill="url(#ivory)"/>
    </g>
  </g>

  <!-- Text safety overlay: keeps left side clean and readable. -->
  <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0.92"/>
    <stop offset="44%" stop-color="#000" stop-opacity="0.78"/>
    <stop offset="64%" stop-color="#000" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="520" fill="url(#textFade)"/>
</svg>
